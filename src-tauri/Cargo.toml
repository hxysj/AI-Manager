[package]
name = "monkey-thief"
version = "2.0.28"
description = "Desktop manager for AI CLI skills, repos and runtime metadata"
authors = ["Monkey Thief"]
edition = "2021"

# 开发构建默认会为每次代码变更保留大量增量编译和调试产物。
# 限制代码生成单元并降低调试信息后，target/debug/deps 不会按默认的
# 256 个代码生成单元持续堆积；保留行号信息，仍可定位本项目的错误。
[profile.dev]
codegen-units = 16
debug = 1

# 依赖库不需要完整调试符号。依赖仍然可以正常调试和链接，但会显著减少
# .o/.pdb 体积；本项目自身继续使用上面的行号调试信息。
[profile.dev.package."*"]
debug = 0

[lib]
name = "monkey_thief_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
local-ip-address = "0.6"
mime_guess = "2"
png = "0.17"
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "socks"] }
ring = "0.17.14"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "sync", "net", "time", "io-util"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
enigo = "0.6.1"
tauri-plugin-global-shortcut = "=2.3.1"
xcap = "0.9.8"
sysinfo = "0.37"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["global_shortcuts", "remote_desktop", "screencast"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
