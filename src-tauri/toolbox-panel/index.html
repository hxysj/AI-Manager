<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实用工具大全</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="toolbox-shell">
      <aside class="toolbox-sidebar">
        <div class="toolbox-brand">
          <span class="toolbox-brand__mark">MT</span>
          <div class="toolbox-brand__main">
            <strong>实用工具大全</strong>
            <span>Utility Toolbox</span>
          </div>
        </div>

        <nav id="toolNav" class="toolbox-nav" aria-label="工具导航"></nav>
      </aside>

      <section class="toolbox-main">
        <header class="toolbox-header">
          <div>
            <p class="toolbox-header__eyebrow">Tools</p>
            <h1 id="toolTitle">工具导航</h1>
            <p id="toolSummary" class="toolbox-header__summary">
              选择一个工具开始处理内容。
            </p>
          </div>
          <button id="homeButton" class="toolbox-button" type="button">
            工具导航
          </button>
        </header>

        <section id="toolContent" class="toolbox-content"></section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
