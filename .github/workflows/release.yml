name: 发布多平台安装包

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验版本与发布说明
        id: version
        run: node scripts/release.mjs prepare

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: 安装 Linux 原生依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config libdbus-1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libgbm-dev libclang-dev libpipewire-0.3-dev libxcb1-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev lsof xclip wl-clipboard
      - run: npm ci
      - name: 校验发布流程与前端
        run: |
          npm run test:platform
          node scripts/test-settings.mjs
          node scripts/test-screenshot-settings.mjs
          node scripts/test-screenshot-rectangles.mjs
          node scripts/test-translation.mjs
      - name: 校验 Rust 与跨平台基础行为
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cross_platform
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib platform_paths_and_windows_variants_are_independent
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib api::claude_desktop_runtime::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib api::screenshot::tests
      - name: 构建安装包与更新签名
        shell: bash
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then unset "$key"; fi
          done
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            config=$(node -e 'process.stdout.write(JSON.stringify({bundle:{macOS:{signingIdentity:process.env.APPLE_SIGNING_IDENTITY}}}))')
            npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$config"
          else
            npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi
          if [ "${{ runner.os }}" = Linux ]; then
            for deb in src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb; do
              if [ ! -f "$deb.sig" ]; then
                node node_modules/@tauri-apps/cli/tauri.js signer sign "$deb"
              fi
            done
          fi
      - name: 整理当前平台产物
        run: node scripts/release.mjs stage ${{ matrix.target }} src-tauri/target/${{ matrix.target }}/release/bundle release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: 合并所有平台更新清单
        run: node scripts/release.mjs merge artifacts release-assets
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: build/release-notes.md
          files: release-assets/*
