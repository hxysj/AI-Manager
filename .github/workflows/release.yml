name: 发布 Windows 安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 编译缓存
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: 缓存 Rust 依赖和产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: 缓存 Tauri 打包工具
        uses: actions/cache@v4
        with:
          path: src-tauri/target/.tauri
          key: ${{ runner.os }}-tauri-tools-${{ hashFiles('src-tauri/tauri.conf.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-tools-

      - name: 安装依赖
        run: npm ci

      - name: 检查发布说明
        shell: pwsh
        run: |
          $notes = Get-Content build/release-notes.md -Raw
          if ($notes -match '请在发布前删除此行') {
            throw '请先更新 build/release-notes.md，再创建 tag 发布。'
          }

      - name: 打包 Windows 安装程序
        env:
          CARGO_INCREMENTAL: 0
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run dist:win

      - name: 规范安装包文件名
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $targetName = 'Monkey-Thief-windows-setup.exe'
          $targetPath = Join-Path $bundleDir $targetName
          $installer = Get-ChildItem $bundleDir -Filter '*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw '未找到 Windows NSIS 安装程序。'
          }

          $signature = Get-Item -LiteralPath "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) {
            throw '未找到 Tauri 更新签名文件。'
          }

          $targetSignaturePath = "$targetPath.sig"
          if ($installer.Name -ne $targetName) {
            if (Test-Path $targetPath) {
              Remove-Item -LiteralPath $targetPath -Force
            }
            Move-Item -LiteralPath $installer.FullName -Destination $targetPath
            if (Test-Path $targetSignaturePath) {
              Remove-Item -LiteralPath $targetSignaturePath -Force
            }
            Move-Item -LiteralPath $signature.FullName -Destination $targetSignaturePath
          }

      - name: 生成旧版 Electron 更新元数据
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundleDir -Filter '*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw '未找到 Windows NSIS 安装程序。'
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $sha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes($installer.FullName)))
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $notes = Get-Content build/release-notes.md -Raw
          $notes = $notes -replace "`r`n", "`n"
          $notesLines = $notes.TrimEnd("`n").Split("`n")

          $latest = @(
            "version: $version"
            'files:'
            "  - url: $($installer.Name)"
            "    sha512: $sha512"
            "    size: $($installer.Length)"
            "path: $($installer.Name)"
            "sha512: $sha512"
            'releaseNotes: |'
          )

          foreach ($line in $notesLines) {
            $latest += "  $line"
          }

          $latest += "releaseDate: '$releaseDate'"
          Set-Content -Path (Join-Path $bundleDir 'latest.yml') -Value ($latest -join "`n") -Encoding utf8

      - name: 生成 Tauri 更新元数据
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $updatePackage = Get-ChildItem $bundleDir -Filter '*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $updatePackage) {
            throw '未找到 Tauri NSIS 更新安装程序。'
          }

          $signatureFile = Get-Item -LiteralPath "$($updatePackage.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signatureFile) {
            throw '未找到 Tauri 更新签名文件。'
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $notes = (Get-Content build/release-notes.md -Raw).Trim()
          $signature = (Get-Content $signatureFile.FullName -Raw).Trim()
          $downloadUrl = "https://github.com/hxysj/AI-Manager/releases/download/$env:GITHUB_REF_NAME/$($updatePackage.Name)"
          $platform = @{
            signature = $signature
            url = $downloadUrl
          }
          $latest = @{
            version = $version
            notes = $notes
            pub_date = $releaseDate
            platforms = @{
              'windows-x86_64' = $platform
              'windows-x86_64-nsis' = $platform
            }
          }

          $latest | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $bundleDir 'latest.json') -Encoding utf8

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: build/release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/latest.yml
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/*.sig
