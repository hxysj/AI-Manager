name: 多平台兼容性校验

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "build/**"
      - "package*.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: 安装 Linux 原生依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libdbus-1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libgbm-dev libclang-dev libpipewire-0.3-dev libxcb1-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev lsof xclip wl-clipboard
      - run: npm ci
      - name: 全模块自动回归并保存证据
        run: node scripts/platform-acceptance.mjs --output acceptance/automated --build
      - name: 校验目标平台原生代码
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: 原生端口探针
        if: runner.os != 'Windows'
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --features desktop-acceptance --bin desktop-acceptance -- --output acceptance/native --ports
      - name: 保存自动验收记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.target }}
          path: acceptance/
          if-no-files-found: warn
